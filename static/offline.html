<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Sin conexión</title>
		<style>
			body {
				margin: 0;
				display: flex;
				min-height: 100vh;
				align-items: center;
				justify-content: center;
				background: #1d232a;
				color: #a6adbb;
				font-family:
					system-ui,
					-apple-system,
					sans-serif;
				text-align: center;
				padding: 1.5rem;
				box-sizing: border-box;
			}
			main {
				max-width: 28rem;
			}
			h1 {
				color: #f3f4f6;
				font-size: 1.5rem;
				margin-bottom: 0.5rem;
			}
			button {
				margin-top: 1.5rem;
				padding: 0.6rem 1.5rem;
				border-radius: 0.5rem;
				border: none;
				background: #7480ff;
				color: #16181d;
				font-weight: 600;
				cursor: pointer;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>Sin conexión</h1>
			<p>No se ha podido cargar esta página porque no hay conexión a internet.</p>
			<button onclick="location.reload()">Reintentar</button>
		</main>
	</body>
</html>
